name: Build ELAK Okulum APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'elak-okulum/android/**'
      - '.github/workflows/build-elak-okulum-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: elak-okulum/android
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp elak-okulum/android/app/build/outputs/apk/debug/app-debug.apk ELAK-Okulum-v0.3-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ELAK-Okulum-v0.3-debug
          path: ELAK-Okulum-v0.3-debug.apk
          if-no-files-found: error
          retention-days: 30
