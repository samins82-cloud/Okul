name: Build ELAK Okulum APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'elak-okulum/android/**'
      - '.github/workflows/build-elak-okulum-apk.yml'

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true

      - name: Install Android 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply photo compatibility patch
        working-directory: elak-okulum/android
        run: python3 patch_v083.py

      - name: Apply WhatsApp and version patch
        working-directory: elak-okulum/android
        run: python3 patch_v086.py

      - name: Apply Izin Kotlin compatibility patch
        working-directory: elak-okulum/android
        run: python3 patch_v088.py

      - name: Apply Izin SSO login button patch
        working-directory: elak-okulum/android
        run: python3 patch_v088_loginbutton.py

      - name: Apply Izin 0.8.13 UX and Rehber patch
        working-directory: elak-okulum/android
        run: python3 patch_v0813.py

      - name: Apply Izin 0.8.14 all contacts patch
        working-directory: elak-okulum/android
        run: python3 patch_v0814.py

      - name: Apply Izin 0.8.15 Rehber phone matching fix
        working-directory: elak-okulum/android
        run: python3 patch_v0815.py

      - name: Apply Izin 0.8.16 class filter
        working-directory: elak-okulum/android
        run: python3 patch_v0816.py

      - name: Align ELAK Okulum 0.9.2 version
        working-directory: elak-okulum/android
        run: python3 patch_v090.py

      - name: Apply 0.9.2 multi-school branding
        working-directory: elak-okulum/android
        run: python3 patch_v092_multischool.py

      - name: Build debug APK
        working-directory: elak-okulum/android
        run: gradle :app:assembleDebug --stacktrace

      - name: Build release APK
        working-directory: elak-okulum/android
        run: gradle :app:assembleRelease --stacktrace

      - name: Prepare APK files
        run: |
          cp elak-okulum/android/app/build/outputs/apk/debug/app-debug.apk ELAK-Okulum-v0.9.2-debug.apk
          cp elak-okulum/android/app/build/outputs/apk/release/app-release-unsigned.apk ELAK-Okulum-v0.9.2-release-unsigned.apk
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" apksigner.jar

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: ELAK-Okulum-v0.9.2-debug
          path: ELAK-Okulum-v0.9.2-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload unsigned release APK
        uses: actions/upload-artifact@v4
        with:
          name: ELAK-Okulum-v0.9.2-release-unsigned
          path: ELAK-Okulum-v0.9.2-release-unsigned.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload apksigner
        uses: actions/upload-artifact@v4
        with:
          name: android-apksigner-35
          path: apksigner.jar
          if-no-files-found: error
          retention-days: 1
