name: Package ELAK CORE Push Add-on

on:
  workflow_dispatch:
  push:
    paths:
      - 'elak-okulum/server/mobile-push.php'
      - 'elak-okulum/server/push-admin.php'
      - 'elak-okulum/server/PUSH_0_9_3_1_KURULUM.md'
      - 'elak-okulum/server/prepare_push_package.py'
      - '.github/workflows/package-elak-central-server.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare safe CORE push add-on
        run: |
          rm -rf ELAK-PUSH-0.9.3.1
          python3 elak-okulum/server/prepare_push_package.py ELAK-PUSH-0.9.3.1
          php -l ELAK-PUSH-0.9.3.1/mobile-push.php
          php -l ELAK-PUSH-0.9.3.1/push-admin.php
          zip -qr ELAK-PUSH-0.9.3.1-SUNUCU.zip ELAK-PUSH-0.9.3.1

      - name: Upload push add-on
        uses: actions/upload-artifact@v4
        with:
          name: ELAK-PUSH-0.9.3.1-SUNUCU
          path: ELAK-PUSH-0.9.3.1-SUNUCU.zip
          if-no-files-found: error
          retention-days: 30
