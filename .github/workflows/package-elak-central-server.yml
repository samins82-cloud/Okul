name: Package ELAK Central Server

on:
  workflow_dispatch:
  push:
    paths:
      - 'elak-okulum/server/**'
      - 'elak-okulum/database/**'
      - '.github/workflows/package-elak-central-server.yml'

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare hosting package
        run: |
          rm -rf package
          mkdir -p package/server package/database
          cp -a elak-okulum/server/. package/server/
          cp -a elak-okulum/database/. package/database/
          cat > package/KURULUM.txt <<'EOF'
          ELAK OKULUM 0.9.2 MERKEZI SUNUCU

          1) Bu paketteki server ve database klasorlerini proje kokune yukleyin.
          2) elak.mcoaihl.com web document root'unu proje kokundeki server klasorune yonlendirin.
          3) Tarayicida https://elak.mcoaihl.com/install.php adresini acin.
          4) MySQL bilgilerini ve merkezi yonetici hesabini girerek kurulumu tamamlayin.
          5) Merkezi yonetimde ilk okul olarak 759975 koduyla Mahmud Celaleddin Okten AIHL kaydini ve okul yoneticisini olusturun.
          6) Kurulumdan sonra install.php dosyasini silin.
          7) API testi: https://elak.mcoaihl.com/api/v1/index.php?r=health

          NOT: Mobil uygulamada 759975 ve MCOAIHL kodlari MCOAIHL gecis doneminde esdeger kabul edilir.
          EOF
          cd package
          zip -r ../ELAK-Central-Server-0.9.2.zip .

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: ELAK-Central-Server-0.9.2
          path: ELAK-Central-Server-0.9.2.zip
          if-no-files-found: error
          retention-days: 30
