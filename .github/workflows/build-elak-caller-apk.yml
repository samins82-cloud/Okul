name: Build ELAK Caller APK

on:
  push:
    branches: [main]
    paths:
      - 'helper-android/**'
      - '.github/workflows/build-elak-caller-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Accept Android licenses
        run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Android 35 SDK
        run: ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: helper-android
        run: gradle --no-daemon clean assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p out
          cp helper-android/app/build/outputs/apk/debug/app-debug.apk out/ELAK-Arayan-Tanima.apk
          sha256sum out/ELAK-Arayan-Tanima.apk > out/SHA256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ELAK-Arayan-Tanima-v1.1.0
          path: out/
          retention-days: 30
