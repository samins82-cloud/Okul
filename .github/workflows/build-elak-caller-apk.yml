name: Build ELAK Caller APK

on:
  push:
    branches: [main]
    paths:
      - 'helper-android/**'
      - '.github/workflows/build-elak-caller-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Preserve caller debug signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: elak-caller-debug-signing-v122

      - name: Accept Android licenses
        run: yes | ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true

      - name: Install Android 35 SDK
        run: ${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Apply v1.2.2 version patch
        working-directory: helper-android
        run: python3 patch_v122.py

      - name: Build installable APK
        working-directory: helper-android
        run: gradle --no-daemon clean assembleDebug --stacktrace

      - name: Prepare APK and metadata
        run: |
          mkdir -p out
          cp helper-android/app/build/outputs/apk/debug/app-debug.apk out/ELAK-Arayan-Tanima.apk
          SHA=$(sha256sum out/ELAK-Arayan-Tanima.apk | awk '{print $1}')
          BYTES=$(stat -c%s out/ELAK-Arayan-Tanima.apk)
          printf '%s  %s\n' "$SHA" 'ELAK-Arayan-Tanima.apk' > out/SHA256.txt
          cat > out/ELAK-Arayan-Tanima.json <<EOF
          {
            "version": "1.2.2",
            "version_code": 6,
            "published_at": "2026-10-17",
            "apk_url": "https://elak.mcoaihl.com/rehber/downloads/ELAK-Arayan-Tanima.apk",
            "sha256": "$SHA",
            "size": $BYTES,
            "notes": "Otomatik güncelleme kontrolü, SHA-256 bütünlük doğrulaması ve Android kurulum ekranına güvenli geçiş eklendi."
          }
          EOF

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ELAK-Arayan-Tanima-v1.2.2
          path: out/
          retention-days: 30
